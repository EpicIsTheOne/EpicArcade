<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ephix — Prompts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand/brand.css" />
  <link rel="stylesheet" href="styles.css" />
  <link id="favicon" rel="icon" type="image/png" href="brand/logos/ephix-icon-32.png" />
<link rel="stylesheet" href="/prompts-page.css">
</head>
<body>
  <div class="bg-bands" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-grain grain-live" aria-hidden="true"></div>
  <div class="bg-halftone drift eb-ambient" aria-hidden="true"></div>
  <div class="eb-sweep" aria-hidden="true"></div>

  <div class="hud-frame" aria-hidden="true">
    <i class="hud-corner tl"></i><i class="hud-corner tr"></i>
    <i class="hud-corner bl"></i><i class="hud-corner br"></i>
  </div>
  <div class="crt-overlay" aria-hidden="true"></div>



  <header class="site-header">
    <div class="masthead-collage eb-ambient" aria-hidden="true"></div>
    <div class="top-bar">
      <div class="brand">
        <img class="brand-mark" src="brand/logos/ephix-icon-96.png" alt="" aria-hidden="true">
        <span>EPHIX</span>
      </div>
      <div class="top-actions"><div class="theme-dots" data-theme-dots></div><button class="icon-btn" id="searchButton" aria-label="Search prompts" title="Search prompts (Ctrl+K)">⌕</button></div>
    </div>
    <img class="masthead-slashes" src="brand/symbols/generated/ephix-symbol-slash-bars-triple-blue.png" alt="" aria-hidden="true">
    <img class="masthead-logo" src="brand/logos/ephix-icon-96.png" alt="" aria-hidden="true">
    <h1 class="mega-title" id="megaTitle">PROMPTS</h1>
    <p class="console-subtitle" id="consoleSubtitle">The 46-prompt gauntlet — copy, track, run</p>
    <img class="masthead-hazard" src="brand/broadcast/generated/ephix-broadcast-hazard-bar-frame.png" alt="" aria-hidden="true">

    <div class="prompt-search"><img class="library-ticket" src="brand/stickers/generated/ephix-sticker-barcode-ticket-001.png" alt="" aria-hidden="true"><label for="promptSearch">Search prompts</label><input id="promptSearch" type="search" placeholder="Search title, difficulty, or prompt text…" autocomplete="off"><p id="promptCount" role="status">Loading prompts…</p></div>
  </header>

  <main id="app" class="container"></main>

  <script src="/prompts-page.js" defer></script>

<style>
/* Ephix feedback panel — brand system */
.eb-overlay{position:fixed;inset:0;background:rgba(5,6,8,.78);backdrop-filter:blur(4px);z-index:120;display:none}
.eb-overlay.open{display:flex;align-items:center;justify-content:center}
.eb-panel{width:min(520px,92vw);max-height:88vh;overflow:auto;background:#0b0e13;border:1px solid #425064;border-left:3px solid #1769ff;
  padding:18px 18px 14px;color:#f4f6f8;font-family:Inter,Arial,sans-serif}
.eb-tabs{display:flex;gap:8px;margin-bottom:14px}
.eb-tab{flex:1;text-align:center;padding:8px;border:1px solid #425064;cursor:pointer;
  font-family:'Barlow Semi Condensed',Arial,sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;color:#a8b0bc;text-transform:uppercase}
.eb-tab.active{color:#fff;border-color:#1769ff;background:rgba(23,105,255,.12)}
.eb-panel label{display:block;font-family:'Barlow Semi Condensed',Arial,sans-serif;font-weight:600;font-size:11px;color:#687585;margin:10px 0 4px;letter-spacing:.12em;text-transform:uppercase}
.eb-panel input,.eb-panel select,.eb-panel textarea{width:100%;background:#11161e;color:#f4f6f8;
  border:1px solid #26303d;padding:8px 10px;font-family:inherit;font-size:13px}
.eb-panel textarea{resize:vertical}
.eb-panel input:focus,.eb-panel select:focus,.eb-panel textarea:focus{outline:none;border-color:#3c86ff}
.eb-send{margin-top:14px;width:100%;padding:10px;background:#1769ff;border:0;
  color:#fff;font-family:'Barlow Semi Condensed',Arial,sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.eb-send:hover{background:#0b42b6}
.eb-msg{min-height:16px;font-size:12px;color:#a8b0bc;margin-top:8px}
.eb-close{float:right;cursor:pointer;color:#a8b0bc;font-size:16px;line-height:1}
.eb-close:hover{color:#3c86ff}
.eb-fab{position:fixed;right:14px;bottom:14px;z-index:90;padding:8px 16px 7px 12px;cursor:pointer;
  background:#18202b;border:1px solid #425064;color:#f4f6f8;
  font-family:'Barlow Semi Condensed',Arial,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;display:flex;align-items:center;gap:6px;text-transform:uppercase;
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%)}
.eb-fab:hover{border-color:#1769ff;color:#fff}
.eb-note{font-size:11px;color:#687585;margin-top:10px}
</style>
<div class="eb-fab" id="ebFab" title="Feedback or suggest a prompt">✦ FEEDBACK / IDEAS</div>
<div class="eb-overlay" id="ebOverlay" role="dialog" aria-label="Ephix feedback">
  <div class="eb-panel">
    <span class="eb-close" id="ebClose">✕</span>
    <div class="eb-tabs">
      <div class="eb-tab active" data-tab="fb">GIVE FEEDBACK</div>
      <div class="eb-tab" data-tab="rq">SUGGEST A PROMPT</div>
    </div>

    <div id="ebFb">
      <label>CATEGORY</label>
      <select id="ebFbCat">
        <option>Website issue</option><option>Benchmark issue</option><option>Result looks wrong</option>
        <option>Prompt feedback</option><option>Feature request</option><option>Other</option>
      </select>
      <label>SHORT TITLE</label>
      <input id="ebFbTitle" maxlength="120"/>
      <label>DESCRIPTION</label>
      <textarea id="ebFbDetails" rows="4" maxlength="4000"></textarea>
      <button class="eb-send" id="ebFbSend">TRANSMIT FEEDBACK</button>
      <div class="eb-msg" id="ebFbMsg"></div>
    </div>

    <div id="ebRq" style="display:none">
      <div class="eb-note">Ideas go to the Ephix review queue — nothing enters the benchmark without manual approval.</div>
      <label>PROPOSED TITLE</label>
      <input id="ebRqTitle" maxlength="140"/>
      <label>THE TASK / PROMPT IDEA</label>
      <textarea id="ebRqIdea" rows="4" maxlength="6000"></textarea>
      <label>WHY IT BELONGS IN EPHIX</label>
      <textarea id="ebRqWhy" rows="2" maxlength="2000"></textarea>
      <label>SUGGESTED DIFFICULTY</label>
      <select id="ebRqDiff"><option>Not sure</option><option>Light</option><option>Medium</option><option>Heavy</option></select>
      <label>CAPABILITY TESTED</label>
      <select id="ebRqCap"><option>other</option><option>frontend/UI</option><option>backend</option><option>debugging</option>
        <option>browser automation</option><option>game development</option><option>agentic research</option><option>tool use</option>
        <option>multimodal</option><option>long-horizon coding</option><option>recovery/resilience</option></select>
      <button class="eb-send" id="ebRqSend">SUBMIT SUGGESTION</button>
      <div class="eb-msg" id="ebRqMsg"></div>
    </div>
  </div>
</div>
<script src="feedback.js" defer></script>
</body>
</html>
