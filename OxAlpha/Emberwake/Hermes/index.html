<canvas id="game-canvas"></canvas>
<script>
// surface runtime errors where headless dumps can see them
window.__errors = [];
window.onerror = function (m, s, l, c) {
  window.__errors.push(m + ' @' + (s || '').split('/').pop() + ':' + l + ':' + c);
  document.title = 'EWERR: ' + window.__errors.join(' | ').slice(0, 220);
};
</script>
<script src="js/lib/three.min.js"></script>
