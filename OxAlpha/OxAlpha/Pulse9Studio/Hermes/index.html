<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyx DAW — Browser Music Workstation</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0c0f16; --bg2:#11151f; --bg3:#161b28; --panel:#12161f; --line:#232938;
  --fg:#dbe2ef; --dim:#8a94a8; --dimmer:#5a6478;
  --accent:#4d8dff; --accent2:#7a5cff; --good:#3ddc97; --warn:#ffcf5d; --bad:#ff5d5d;
  --sel:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:13px; user-select:none;
}
button{font-family:inherit;}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:10px;height:46px;padding:0 10px;
  background:linear-gradient(180deg,#151a26,#10141d);
  border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:baseline;gap:6px;margin-right:6px;}
.logo b{font-size:15px;letter-spacing:1px;color:#fff;}
.logo span{font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;}
.tbtn{
  background:#1a2030;border:1px solid var(--line);color:var(--fg);
  height:28px;padding:0 12px;border-radius:4px;font-size:12px;cursor:pointer;
}
.tbtn:hover{background:#222939;border-color:#303a52;}
.tbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tbtn.playing{background:#1f8a55;border-color:#27aa68;}
.transport-group{display:flex;gap:4px;align-items:center;}
.pos-display{
  font-family:"Cascadia Code",ui-monospace,Consolas,monospace;font-size:16px;
  background:#0a0d13;border:1px solid var(--line);border-radius:4px;
  padding:3px 10px;color:#9fe8c0;min-width:104px;text-align:center;letter-spacing:1px;
}
.num-drag{
  font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#0a0d13;
  border:1px solid var(--line);border-radius:4px;color:var(--warn);
  padding:3px 6px;width:56px;text-align:center;cursor:ns-resize;
}
.num-label{font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:1px;}
.spacer{flex:1;}
.cpu-display{font-size:11px;color:var(--dimmer);font-family:ui-monospace,monospace;}

/* menu */
.menu-wrap{position:relative;}
.menu{
  position:absolute;top:32px;left:0;z-index:3000;display:none;min-width:190px;
  background:#171c29;border:1px solid #2b3348;border-radius:6px;
  box-shadow:0 10px 34px rgba(0,0,0,.55);padding:4px;
}
.menu.open{display:block;}
.menu button{
  display:block;width:100%;text-align:left;background:none;border:none;color:var(--fg);
  padding:7px 12px;border-radius:4px;font-size:12.5px;cursor:pointer;
}
.menu button:hover{background:#222a3d;}
.menu .sep{height:1px;background:var(--line);margin:4px 0;}

/* ---------- main layout ---------- */
#main{display:flex;height:calc(100% - 46px);}
.panel{background:var(--panel);overflow:hidden;display:flex;flex-direction:column;}
#leftPanel{width:340px;min-width:280px;border-right:1px solid var(--line);}
#centerPanel{flex:1;display:flex;flex-direction:column;background:var(--bg2);}

/* channel rack */
.rack-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);}
.ptitle{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);}
#chList{flex:1;overflow-y:auto;min-height:90px;}
.ch-row{
  display:flex;align-items:center;gap:6px;height:34px;padding:0 8px;
  border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;
}
.ch-row.sel{background:rgba(77,141,255,.12);box-shadow:inset 2px 0 0 var(--accent);}
.led{width:9px;height:9px;border-radius:50%;background:#242b3b;border:1px solid #333c52;flex:none;}
.led-mute.on{background:var(--bad);box-shadow:0 0 6px var(--bad);}
.led-solo.on{background:var(--warn);box-shadow:0 0 6px var(--warn);}
.ch-dot{width:8px;height:8px;border-radius:2px;flex:none;}
.ch-dot.big{width:14px;height:14px;}
.ch-name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-knob{margin-left:2px;}
.mini-btn{
  background:#1c2231;border:1px solid var(--line);color:var(--dim);border-radius:3px;
  width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;
}
.mini-btn:hover{color:#fff;border-color:#39435e;}
.mini-btn.off{opacity:.4;}
.add-ch-btn{
  width:calc(100% - 16px);margin:8px;background:#182031;border:1px dashed #2c3852;
  color:var(--dim);padding:6px;border-radius:4px;cursor:pointer;font-size:12px;
}
.add-ch-btn:hover{color:#fff;border-color:var(--accent);}

/* step grid */
#rackGridWrap{position:relative;border-top:1px solid var(--line);background:var(--bg2);flex:1;overflow:auto;}
#rackGrid{display:block;cursor:pointer;}

/* browser */
#browserPanel{width:230px;min-width:200px;border-left:1px solid var(--line);}
#browserList{flex:1;overflow-y:auto;padding:6px;}
.br-group-title{font-size:10px;letter-spacing:1.4px;color:var(--dimmer);text-transform:uppercase;padding:8px 6px 3px;}
.br-item{
  display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px;
}
.br-item:hover{background:#1c2334;color:#fff;}
.br-item::after{content:'+';margin-left:auto;color:var(--dimmer);}
.br-dot{width:7px;height:7px;border-radius:2px;}

/* ---------- center tabs / piano roll / playlist ---------- */
.tabbar{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:var(--bg2);}
.tab{
  background:#161b28;border:1px solid var(--line);border-bottom:none;color:var(--dim);
  padding:6px 18px;border-radius:6px 6px 0 0;font-size:12px;cursor:pointer;
}
.tab.active{background:#1c2233;color:#fff;border-color:#2c3650;}
.toolbar{
  display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);
  background:var(--bg2);
}
.toolbar select,.toolbar input[type=number]{
  background:#0e1219;border:1px solid var(--line);color:var(--fg);border-radius:4px;
  padding:3px 6px;font-size:12px;
}
.tool-label{font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:1px;}
.hint{font-size:11px;color:var(--dimmer);margin-left:auto;font-family:ui-monospace,monospace;}
.canvas-host{flex:1;position:relative;overflow:hidden;background:#141821;}
.canvas-row{display:flex;height:100%;}
#prKeys,#plHeads{display:block;flex:none;}
#prCanvas,#plCanvas{display:block;}

/* playlist palette */
#plPalette{
  display:flex;flex-direction:column;gap:2px;width:128px;flex:none;overflow-y:auto;
  background:var(--bg2);border-right:1px solid var(--line);padding:4px;
}
.pal-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:11.5px;}
.pal-item:hover{background:#1c2334;}
.pal-dot{width:8px;height:8px;border-radius:2px;flex:none;}
.pal-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- mixer strip window content ---------- */
#mixerStrips{display:flex;gap:6px;padding:10px;overflow-x:auto;align-items:stretch;min-height:100%;}
.mx-strip{
  width:86px;min-width:86px;background:var(--bg3);border:1px solid var(--line);
  border-radius:6px;display:flex;flex-direction:column;align-items:center;padding:8px 6px;gap:7px;cursor:pointer;
}
.mx-strip.master{border-color:#33405e;}
.mx-strip.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.mx-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;max-width:76px;text-overflow:ellipsis;}
.mx-knobs{display:flex;gap:10px;}
.mx-btns{display:flex;gap:5px;}
.mx-mute,.mx-solo{
  width:22px;height:20px;border-radius:3px;border:1px solid var(--line);
  background:#1a2130;color:var(--dim);font-size:11px;cursor:pointer;
}
.mx-mute.on{background:var(--bad);color:#fff;border-color:var(--bad);}
.mx-solo.on{background:var(--warn);color:#1a1408;border-color:var(--warn);}
.mx-meter{
  position:relative;width:12px;flex:1;min-height:70px;background:#0a0d13;
  border:1px solid var(--line);border-radius:3px;overflow:hidden;width:12px;
}
.mx-meter-fill{
  position:absolute;bottom:0;left:0;right:0;height:0%;
  background:linear-gradient(180deg,#3ddc97,#3ddc97 70%,#ffcf5d 85%,#ff5d5d);
}
.mx-meter-peak{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.75);bottom:0;}

/* ---------- floating windows ---------- */
#winLayer{position:fixed;inset:0;pointer-events:none;z-index:1500;}
.nwindow{
  position:absolute;pointer-events:auto;min-width:260px;
  background:#151a26;border:1px solid #2b3348;border-radius:8px;
  box-shadow:0 14px 44px rgba(0,0,0,.6);display:none;overflow:hidden;
}
.nw-head{
  display:flex;align-items:center;height:30px;padding:0 8px 0 12px;
  background:#1a2130;border-bottom:1px solid var(--line);cursor:move;
}
.nw-title{flex:1;font-size:12px;color:#cfd8ea;font-weight:600;letter-spacing:.3px;}
.nw-close{background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;padding:2px 6px;}
.nw-close:hover{color:var(--bad);}
.nw-body{padding:10px;max-height:60vh;overflow-y:auto;}

/* knobs */
.knob{
  position:relative;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,#2a3247,#171c29);
  border:1px solid #333d58;cursor:ns-resize;flex:none;touch-action:none;
}
.knob-ind{
  position:absolute;top:2px;left:50%;width:2px;height:9px;background:#9fb6ff;
  transform-origin:50% 11px;border-radius:2px;
}
.knob::after{
  content:attr(data-val);
  position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:#aebadb;background:#0d1119;border:1px solid var(--line);
  padding:0 4px;border-radius:3px;opacity:0;pointer-events:none;white-space:nowrap;z-index:50;
  font-family:ui-monospace,monospace;
}
.knob:hover::after{opacity:1;}
.labeled-knob{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px;}
.labeled-knob > span{font-size:8.5px;color:var(--dimmer);letter-spacing:.8px;text-transform:uppercase;text-align:center;}
.sel-wrap select{width:100%;}

/* synth / drum windows */
.sy-section{font-size:9.5px;letter-spacing:1.6px;color:var(--dimmer);margin:10px 0 5px;text-transform:uppercase;}
.sy-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sy-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.text-input{
  background:#0e1219;border:1px solid var(--line);color:var(--fg);border-radius:4px;
  padding:4px 8px;font-size:12.5px;width:170px;
}
.text-input:focus{outline:none;border-color:var(--accent);}
.btn{
  background:#22304d;border:1px solid #33436a;color:#dce6ff;padding:5px 12px;
  border-radius:4px;font-size:12px;cursor:pointer;
}
.btn:hover{background:#2a3a5f;}
.btn.small{padding:3px 9px;font-size:11.5px;}
.drum-win .dw-info{color:var(--dim);font-size:12px;margin-bottom:8px;}
.dw-row{display:flex;gap:8px;margin-bottom:8px;}

/* fx rack */
.fx-rack .fx-head{font-size:11px;color:var(--dim);letter-spacing:.5px;margin-bottom:8px;}
.fx-row{
  display:flex;align-items:center;gap:6px;background:#181e2d;border:1px solid var(--line);
  border-radius:5px;padding:5px 8px;margin-bottom:2px;font-size:12px;
}
.fx-row.disabled{opacity:.45;}
.fx-name{font-weight:600;}
.fx-spacer{flex:1;}
.fx-empty{color:var(--dimmer);font-size:12px;padding:8px 2px;}
.fx-params{display:flex;gap:8px;padding:6px 8px 10px;flex-wrap:wrap;}
.fx-add{display:flex;gap:6px;margin-top:10px;}
.fx-select{
  background:#0e1219;border:1px solid var(--line);color:var(--fg);border-radius:4px;
  padding:4px 6px;font-size:12px;
}

/* toast */
#toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1c2434;border:1px solid #33405e;color:#e6ecf7;padding:9px 18px;
  border-radius:6px;font-size:12.5px;z-index:5000;transition:transform .25s ease;
  box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:70vw;
}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.err{border-color:var(--bad);color:#ffd9d9;}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#0d1017;}
::-webkit-scrollbar-thumb{background:#28304a;border-radius:5px;border:2px solid #0d1017;}
::-webkit-scrollbar-thumb:hover{background:#37426a;}

/* status bar */
#statusbar{
  position:fixed;bottom:0;left:0;right:0;height:20px;display:flex;align-items:center;gap:14px;
  background:#10131b;border-top:1px solid var(--line);padding:0 12px;
  font-size:10.5px;color:var(--dimmer);z-index:1200;
}
body.playing #statusbar{border-top-color:#1f5c40;}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo"><b>NYX</b><span>DAW</span></div>

  <div class="menu-wrap">
    <button class="tbtn" id="btnFile">File ▾</button>
    <div class="menu" id="fileMenu">
      <button id="miNew">New project</button>
      <button id="miDemo">Load demo — “Midnight Circuit”</button>
      <div class="sep"></div>
      <button id="miSave">Save project to disk (Ctrl+S)</button>
      <button id="miOpen">Open project file…</button>
      <div class="sep"></div>
      <button id="miExportWav">Export audio — WAV</button>
      <button id="miExportJson">Export project data — JSON</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".json,application/json" style="display:none">

  <div class="transport-group">
    <button class="tbtn" id="btnPlay" title="Play/Pause (Space)">▶ Play</button>
    <button class="tbtn" id="btnStop" title="Stop (return to zero)">■ Stop</button>
  </div>

  <div class="pos-display" id="posDisplay">001:1:1</div>

  <div>
    <div class="num-label">tempo</div>
    <input class="num-drag" id="bpmInput" value="140" inputmode="numeric" style="cursor:default">
  </div>
  <div style="cursor:ns-resize" id="bpmDrag" title="Drag up/down to change tempo">↕</div>

  <div>
    <div class="num-label">swing %</div>
    <input class="num-drag" id="swingInput" value="0" inputmode="numeric" style="cursor:default">
  </div>

  <div class="transport-group">
    <button class="tbtn active" id="btnModePattern" title="Pattern mode">PAT</button>
    <button class="tbtn" id="btnModeSong" title="Song mode">SONG</button>
    <button class="tbtn active" id="btnLoop" title="Loop">⟳ Loop</button>
    <button class="tbtn" id="btnMixer" title="Show mixer">Mixer</button>
  </div>

  <div class="spacer"></div>

  <button class="tbtn" id="btnUndo" title="Undo (Ctrl+Z)">⤺</button>
  <button class="tbtn" id="btnRedo" title="Redo (Ctrl+Shift+Z)">⤻</button>
  <span class="cpu-display" id="cpuDisplay">CPU 0%</span>
</div>

<div id="main">
  <!-- left: rack -->
  <div class="panel" id="leftPanel">
    <div class="rack-head"><span class="ptitle">Channel Rack</span></div>
    <div id="chList"></div>
    <div id="rackGridWrap"><canvas id="rackGrid"></canvas></div>
  </div>

  <!-- center: piano roll / playlist -->
  <div class="panel" id="centerPanel">
    <div class="tabbar">
      <button class="tab" id="tabPlaylist">Playlist</button>
      <button class="tab" id="tabPiano">Piano Roll</button>
    </div>

    <div id="playlistPanel" class="canvas-row" style="flex:1;">
      <div id="plPalette"></div>
      <div style="display:flex;flex-direction:column;flex:1;min-width:0;">
        <div class="toolbar">
          <span class="ptitle">Arrangement</span>
          <button class="mini-btn" id="plAddTrack" title="Add playlist track" style="width:auto;padding:0 8px;">+ Track</button>
          <button class="mini-btn" id="btnSongLen" title="Song length in bars" style="width:auto;padding:0 8px;">Length</button>
          <span style="flex:1"></span>
          <button class="mini-btn" id="zoomOutPl">−</button>
          <button class="mini-btn" id="zoomInPl">+</button>
        </div>
        <div class="canvas-host">
          <div class="canvas-row">
            <canvas id="plHeads"></canvas>
            <canvas id="plCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div id="pianoPanel" class="canvas-row" style="flex:1;display:none;">
      <div style="display:flex;flex-direction:column;flex:1;min-width:0;">
        <div class="toolbar">
          <select id="prPatternSel" title="Pattern"></select>
          <button class="mini-btn" id="prAddPattern" title="New pattern" style="width:auto;padding:0 8px;">+ Pattern</button>
          <span class="tool-label">len</span>
          <input type="number" id="prLength" min="1" max="256" value="16" style="width:54px">
          <span class="tool-label">snap</span>
          <select id="prSnap">
            <option value="0">off</option>
            <option value="4" selected>1/4 beat</option>
            <option value="1">1 step (1/16)</option>
            <option value="0.5">1/2 step</option>
          </select>
          <span style="flex:1"></span>
          <button class="mini-btn" id="zoomOut">−</button>
          <button class="mini-btn" id="zoomIn">+</button>
        </div>
        <div class="hint" id="prHint" style="padding:2px 10px;"></div>
        <div class="canvas-host">
          <div class="canvas-row">
            <canvas id="prKeys"></canvas>
            <canvas id="prCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- right: browser -->
  <div class="panel" id="browserPanel">
    <div class="rack-head"><span class="ptitle">Instrument Browser</span></div>
    <div id="browserList"></div>
  </div>
</div>

<!-- mixer + FX live in a docked bottom layer via windows -->
<div id="winLayer"></div>

<div id="statusbar">
  <span>Nyx DAW — original browser workstation</span>
  <span id="sbProject"></span>
  <span style="margin-left:auto">Space play · Ctrl+Z undo · Ctrl+S save · Del delete · wheel scroll · Ctrl+wheel zoom</span>
</div>

<div id="toast"></div>

<script src="js/wav.js"></script>
<script src="js/project.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui/core.js"></script>
<script src="js/ui/rack.js"></script>
<script src="js/ui/pianoroll.js"></script>
<script src="js/ui/playlist.js"></script>
<script src="js/ui/mixer.js"></script>
<script src="js/ui/synth.js"></script>
<script>
// boot after all modules
window.addEventListener('DOMContentLoaded', function () {
  NyxUI.start();
  // expose a couple of aliases for tests
  window.NyxTest = {
    project: () => NyxUI.project,
    engine: () => NyxUI.engine,
    ui: NyxUI,
    NP: window.NyxProject, NE: window.NyxEngine, Wav: window.WavEncoder
  };
});
</script>
</body>
</html>
