<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PULSE-9 — Browser Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/daw.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230b0d12'/><path d='M2 9h2l1.5-4 2 7 2-9 2 8 1.5-2h3' stroke='%2333e0c8' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<div id="app">

  <!-- ============ TOP BAR ============ -->
  <header id="topbar">
    <div class="tb-logo"><span class="logo-mark">PULSE<b>—9</b></span><span class="logo-sub">browser studio</span></div>

    <div class="tb-group tb-transport">
      <button id="btn-play" class="tbtn tbtn-play" title="Play / Pause  (Space)"><span class="ic ic-play"></span></button>
      <button id="btn-stop" class="tbtn" title="Stop  (Enter)"><span class="ic ic-stop"></span></button>
      <button id="btn-loop" class="tbtn tbtn-toggle on" title="Loop"><span class="ic ic-loop"></span></button>
      <div class="mode-switch" title="Pat = loop current pattern · Song = play arrangement">
        <button id="mode-pat" class="on">PAT</button><button id="mode-song">SONG</button>
      </div>
    </div>

    <div class="tb-group tb-clock">
      <div class="lcd">
        <div class="lcd-pos"><span id="lcd-bar">1</span>:<span id="lcd-beat">1</span>:<span id="lcd-tick">1</span></div>
        <div class="lcd-time" id="lcd-time">0:00.0</div>
      </div>
      <div class="bpm-box">
        <span class="bpm-val" id="bpm-val" title="Drag vertically to change · double-click to type">128</span>
        <span class="bpm-unit">BPM</span>
      </div>
      <div class="swing-box"><span class="mini-lbl">SWING</span><input id="swing" type="range" min="0" max="80" value="0" title="Shuffle amount %"></div>
    </div>

    <div class="tb-spacer"></div>

    <canvas id="spectrum" width="180" height="34" title="Master spectrum"></canvas>
    <canvas id="master-meter" width="120" height="34" title="Master output · peak hold"></canvas>

    <div class="tb-group tb-actions">
      <button id="btn-undo" class="tbtn" title="Undo (Ctrl+Z)"><span class="ic ic-undo"></span></button>
      <button id="btn-redo" class="tbtn" title="Redo (Ctrl+Y)"><span class="ic ic-redo"></span></button>
      <button id="btn-save" class="abtn" title="Save project to browser + download .json (Ctrl+S)">SAVE</button>
      <button id="btn-load" class="abtn" title="Open a .json project file">OPEN</button>
      <button id="btn-export" class="abtn abtn-accent" title="Render song to .wav (Ctrl+E)">EXPORT</button>
      <button id="btn-help" class="tbtn" title="Help / shortcuts (F1)"><span class="ic ic-help"></span></button>
    </div>
    <input type="file" id="file-open" accept=".json,application/json" hidden>
  </header>

  <!-- ============ MAIN GRID ============ -->
  <main id="main">

    <!-- Channel Rack -->
    <section id="rack-panel" class="panel">
      <div class="panel-head">
        <h2>CHANNEL RACK</h2>
        <div class="panel-tools">
          <button id="rack-menu" class="mini-btn" title="Add channel">+ ADD</button>
        </div>
      </div>
      <div id="rack-body" class="panel-body"></div>
    </section>

    <!-- Center column: playlist over piano roll -->
    <section id="center">
      <section id="playlist-panel" class="panel">
        <div class="panel-head">
          <h2>PLAYLIST</h2>
          <div class="panel-tools">
            <span class="tool-lbl">CLIP</span>
            <select id="pl-clip-pat" title="Pattern painted when you click an empty playlist slot"></select>
            <button id="pl-clear" class="mini-btn" title="Remove all clips from the playlist">CLEAR</button>
          </div>
        </div>
        <div id="playlist-body" class="panel-body"></div>
      </section>

      <section id="piano-panel" class="panel">
        <div class="panel-head">
          <h2>PIANO ROLL <span id="pr-channel-lbl" class="head-dim"></span></h2>
          <div class="panel-tools">
            <span class="tool-lbl">SNAP</span>
            <select id="pr-snap">
              <option value="4">1/4</option>
              <option value="2">1/8</option>
              <option value="1" selected>1/16</option>
              <option value="0.5">1/32</option>
              <option value="0">off</option>
            </select>
            <button id="pr-zoom-out" class="mini-btn" title="Zoom out (Ctrl+wheel on grid)">−</button>
            <button id="pr-zoom-in" class="mini-btn" title="Zoom in (Ctrl+wheel on grid)">+</button>
            <button id="pr-clear" class="mini-btn" title="Delete all notes in this pattern">CLEAR</button>
          </div>
        </div>
        <div id="piano-body" class="panel-body"></div>
      </section>
    </section>

    <!-- Mixer -->
    <section id="mixer-panel" class="panel">
      <div class="panel-head"><h2>MIXER</h2>
        <div class="panel-tools"><span class="tool-lbl" id="mix-sel-lbl">MASTER</span></div>
      </div>
      <div id="mixer-body" class="panel-body"></div>
    </section>

  </main>

  <!-- ============ STATUS BAR ============ -->
  <footer id="statusbar">
    <span id="status-msg">Ready.</span>
    <span class="sb-spacer"></span>
    <span id="sb-voices">0 voices</span>
    <span id="sb-cpu">—</span>
    <span id="sb-hint">Space play · F1 help</span>
  </footer>

  <!-- ============ FLOATING: INSTRUMENT EDITOR ============ -->
  <div id="instrument-panel" class="float-panel" hidden>
    <div class="fp-head">
      <h2 id="inst-title">INSTRUMENT</h2>
      <div class="fp-tools">
        <button id="inst-close" class="mini-btn" title="Close">✕</button>
      </div>
    </div>
    <div id="inst-body" class="fp-body"></div>
  </div>

  <!-- ============ FLOATING: FX EDITOR ============ -->
  <div id="fx-panel" class="float-panel" hidden>
    <div class="fp-head">
      <h2 id="fx-title">EFFECT</h2>
      <div class="fp-tools">
        <button id="fx-remove" class="mini-btn warn" title="Remove this effect">REMOVE</button>
        <button id="fx-close" class="mini-btn" title="Close">✕</button>
      </div>
    </div>
    <div id="fx-body" class="fp-body"></div>
  </div>

  <!-- ============ MENUS / DIALOGS ============ -->
  <div id="menu-layer" hidden></div>

  <div id="modal-layer" hidden>
    <div id="modal-box">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div id="modal-btns"></div>
    </div>
  </div>

  <div id="toast-layer"></div>
</div>

<script src="js/core/model.js"></script>
<script src="js/core/sequencer.js"></script>
<script src="js/core/wav.js"></script>
<script src="js/audio/dsp.js"></script>
<script src="js/audio/engine.js"></script>
<script src="js/audio/transport.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/controls.js"></script>
<script src="js/ui/rack.js"></script>
<script src="js/ui/pianoroll.js"></script>
<script src="js/ui/playlist.js"></script>
<script src="js/ui/mixer.js"></script>
<script src="js/ui/instrument.js"></script>
<script src="js/ui/fx.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
