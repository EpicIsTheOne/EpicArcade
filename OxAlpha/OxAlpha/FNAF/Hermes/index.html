<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WONDERDROME — night shift</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050709'/%3E%3Ccircle cx='5' cy='7' r='2' fill='%23ffcf70'/%3E%3Ccircle cx='11' cy='7' r='2' fill='%23ffcf70'/%3E%3C/svg%3E">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="monitor" class="hidden"></div>
<div id="menu"></div>
<div id="death" class="hidden"></div>
<div id="win" class="hidden"></div>
<div id="filesPanel" class="hidden"></div>
<div id="pause" class="hidden"></div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/gltf/GLTFLoader.js"></script>
<script src="js/vendor/post/EffectComposer.js"></script>
<script src="js/vendor/post/RenderPass.js"></script>
<script src="js/vendor/post/ShaderPass.js"></script>
<script src="js/vendor/post/UnrealBloomPass.js"></script>
<script src="js/vendor/shaders/CopyShader.js"></script>
<script src="js/vendor/shaders/LuminosityHighPassShader.js"></script>
<script>
// CRT/static post shader (subtle in-world, heavier over cameras)
window.WD = window.WD || {};
WD.CRTShader = {
  uniforms:{ tDiffuse:{value:null}, time:{value:0}, density:{value:0.07} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float time; uniform float density; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec2 uv=vUv;
      vec2 cc=uv-0.5;
      uv = uv + cc*dot(cc,cc)*0.05;
      vec3 col=texture2D(tDiffuse,uv).rgb;
      col *= 1.0 - density*0.55*(0.5+0.5*sin(uv.y*900.0));
      float n=hash(uv*vec2(1280.0,720.0)+fract(time)*17.0);
      col += (n-0.5)*density*0.5;
      float tear = step(0.9985, hash(vec2(floor(time*9.0), floor(uv.y*110.0))));
      col += tear*density*1.2;
      col *= smoothstep(0.98,0.32,length(cc));
      gl_FragColor=vec4(col,1.0);
    }`
};
</script>
<script src="js/core.js"></script>
<script src="js/textures.js"></script>
<script src="js/world.js"></script>
<script src="js/characters.js"></script>
<script src="js/audio.js"></script>
<script src="js/ai.js"></script>
<script src="js/lore.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>window.addEventListener('load', ()=>WD.game.boot());</script>
</body>
</html>
