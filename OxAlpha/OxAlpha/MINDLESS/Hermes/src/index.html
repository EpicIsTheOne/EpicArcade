<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINDLESS — Kontraŭ Menso (Browser Recreation)</title>
<style>
  @font-face {
    font-family: 'Press Start 2P';
    src: url('assets/art/fonts/PressStart2P.ttf') format('truetype');
    font-display: block;
  }

  html, body {
    margin: 0; padding: 0; background: #050508; height: 100%;
    overflow: hidden; font-family: monospace;
  }
  #wrap {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; width: 100vw;
  }
  canvas#game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 60px rgba(30, 20, 60, 0.6);
    outline: none;
  }
  #hint {
    position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%);
    color: #3a3f52; font-size: 11px; letter-spacing: 1px;
    font-family: 'Press Start 2P', monospace; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="240" height="135"></canvas>
</div>
<div id="hint">WASD MOVE · C ATTACK · X/SPACE JUMP · E SWAP · Q MODE · V RAGE · ESC PAUSE</div>
<script src="js/util.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/entities.js"></script>
<script src="js/enemies.js"></script>
<script src="js/stages.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
