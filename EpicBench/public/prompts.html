<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epic Bench — Prompts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2304060c' stroke='%2322d3ee'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/prompts-page.css">
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="space-decor" aria-hidden="true">
    <div class="orbit-ring ring-1"></div>
    <div class="orbit-ring ring-2"></div>
    <div class="orbit-ring ring-3"></div>
    <div class="planet-earth"></div>
  </div>

  <div class="hud-frame" aria-hidden="true">
    <i class="hud-corner tl"></i><i class="hud-corner tr"></i>
    <i class="hud-corner bl"></i><i class="hud-corner br"></i>
  </div>
  <div class="crt-overlay" aria-hidden="true"></div>



  <header class="site-header">
    <div class="top-bar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z" />
          <circle cx="12" cy="12" r="3.2" />
          <path d="M12 6.4v2.4M12 15.2v2.4M7.7 9.6l2.1 1.2M14.2 13.2l2.1 1.2M16.3 9.6l-2.1 1.2M9.8 13.2l-2.1 1.2" />
        </svg>
        <span>EPIC BENCH</span>
      </div>
      <div class="top-actions"><button class="icon-btn" id="searchButton" aria-label="Search prompts" title="Search prompts (Ctrl+K)">⌕</button></div>
    </div>
    <h1 class="mega-title" id="megaTitle">EPIC BENCH</h1>
    <p class="console-subtitle" id="consoleSubtitle">PROMPT LIBRARY</p>

    <div class="prompt-search"><label for="promptSearch">Search prompts</label><input id="promptSearch" type="search" placeholder="Search title, difficulty, or prompt text…" autocomplete="off"><p id="promptCount" role="status">Loading prompts…</p></div>
  </header>

  <main id="app" class="container"></main>

  <script src="/prompts-page.js" defer></script>

<style>
/* Epic Bench community panel — matches HUD vibe, hidden by default */
.eb-overlay{position:fixed;inset:0;background:rgba(2,6,12,.72);backdrop-filter:blur(3px);z-index:120;display:none}
.eb-overlay.open{display:flex;align-items:center;justify-content:center}
.eb-panel{width:min(520px,92vw);max-height:88vh;overflow:auto;background:#070d16;border:1px solid rgba(34,211,238,.35);
  border-radius:12px;padding:18px 18px 14px;color:#cfe3f2;font-family:Rajdhani,'Segoe UI',sans-serif;
  box-shadow:0 0 40px rgba(34,211,238,.15)}
.eb-tabs{display:flex;gap:8px;margin-bottom:14px}
.eb-tab{flex:1;text-align:center;padding:8px;border:1px solid rgba(34,211,238,.3);border-radius:8px;cursor:pointer;
  font-family:Orbitron,Rajdhani,sans-serif;font-size:12px;letter-spacing:.08em;color:#7f97ab}
.eb-tab.active{color:#22d3ee;border-color:#22d3ee;background:rgba(34,211,238,.08)}
.eb-panel label{display:block;font-size:11px;color:#7f97ab;margin:10px 0 4px;letter-spacing:.06em}
.eb-panel input,.eb-panel select,.eb-panel textarea{width:100%;background:#0a1420;color:#dbeafe;
  border:1px solid #24435c;border-radius:6px;padding:7px 9px;font-family:inherit;font-size:13px}
.eb-panel textarea{resize:vertical}
.eb-send{margin-top:14px;width:100%;padding:10px;background:rgba(34,211,238,.1);border:1px solid #22d3ee66;
  color:#22d3ee;border-radius:8px;cursor:pointer;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.1em}
.eb-send:hover{background:rgba(34,211,238,.2)}
.eb-msg{min-height:16px;font-size:12px;color:#7dd3fc;margin-top:8px}
.eb-close{float:right;cursor:pointer;color:#7f97ab;font-size:16px;line-height:1}
.eb-close:hover{color:#22d3ee}
.eb-fab{position:fixed;right:14px;bottom:14px;z-index:90;padding:7px 12px;border-radius:999px;cursor:pointer;
  background:rgba(4,10,18,.78);border:1px solid rgba(34,211,238,.3);color:#22d3ee;
  font-family:Rajdhani,sans-serif;font-size:12px;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.eb-fab:hover{border-color:#22d3ee;background:rgba(34,211,238,.12)}
.eb-note{font-size:11px;color:#64809a;margin-top:10px}
</style>
<div class="eb-fab" id="ebFab" title="Feedback or suggest a prompt">✦ FEEDBACK / IDEAS</div>
<div class="eb-overlay" id="ebOverlay" role="dialog" aria-label="Epic Bench feedback">
  <div class="eb-panel">
    <span class="eb-close" id="ebClose">✕</span>
    <div class="eb-tabs">
      <div class="eb-tab active" data-tab="fb">GIVE FEEDBACK</div>
      <div class="eb-tab" data-tab="rq">SUGGEST A PROMPT</div>
    </div>

    <div id="ebFb">
      <label>CATEGORY</label>
      <select id="ebFbCat">
        <option>Website issue</option><option>Benchmark issue</option><option>Result looks wrong</option>
        <option>Prompt feedback</option><option>Feature request</option><option>Other</option>
      </select>
      <label>SHORT TITLE</label>
      <input id="ebFbTitle" maxlength="120"/>
      <label>DESCRIPTION</label>
      <textarea id="ebFbDetails" rows="4" maxlength="4000"></textarea>
      <button class="eb-send" id="ebFbSend">TRANSMIT FEEDBACK</button>
      <div class="eb-msg" id="ebFbMsg"></div>
    </div>

    <div id="ebRq" style="display:none">
      <div class="eb-note">Ideas go to Epic's review queue — nothing enters the benchmark without manual approval.</div>
      <label>PROPOSED TITLE</label>
      <input id="ebRqTitle" maxlength="140"/>
      <label>THE TASK / PROMPT IDEA</label>
      <textarea id="ebRqIdea" rows="4" maxlength="6000"></textarea>
      <label>WHY IT BELONGS IN EPIC BENCH</label>
      <textarea id="ebRqWhy" rows="2" maxlength="2000"></textarea>
      <label>SUGGESTED DIFFICULTY</label>
      <select id="ebRqDiff"><option>Not sure</option><option>Light</option><option>Medium</option><option>Heavy</option></select>
      <label>CAPABILITY TESTED</label>
      <select id="ebRqCap"><option>other</option><option>frontend/UI</option><option>backend</option><option>debugging</option>
        <option>browser automation</option><option>game development</option><option>agentic research</option><option>tool use</option>
        <option>multimodal</option><option>long-horizon coding</option><option>recovery/resilience</option></select>
      <button class="eb-send" id="ebRqSend">SUBMIT SUGGESTION</button>
      <div class="eb-msg" id="ebRqMsg"></div>
    </div>
  </div>
</div>
<script src="epicbench.js" defer></script>
</body>
</html>
