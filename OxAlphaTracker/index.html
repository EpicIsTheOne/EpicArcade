<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OX ALPHA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2304060c' stroke='%2322d3ee'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="space-decor" aria-hidden="true">
    <div class="orbit-ring ring-1"></div>
    <div class="orbit-ring ring-2"></div>
    <div class="orbit-ring ring-3"></div>
    <div class="planet-earth"></div>
  </div>

  <div class="hud-frame" aria-hidden="true">
    <i class="hud-corner tl"></i><i class="hud-corner tr"></i>
    <i class="hud-corner bl"></i><i class="hud-corner br"></i>
  </div>
  <div class="crt-overlay" aria-hidden="true"></div>

  <nav id="miniHud" class="mini-hud" aria-label="Progress HUD">
    <span class="mh-brand">OXA</span>
    <div class="mh-bar"><div class="mh-fill" id="mhFill"></div></div>
    <span class="mh-pct" id="mhPct">0%</span>
    <div class="mh-dots" id="mhDots"></div>
  </nav>

  <header class="site-header">
    <div class="top-bar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2z" />
          <circle cx="12" cy="12" r="3.2" />
          <path d="M12 6.4v2.4M12 15.2v2.4M7.7 9.6l2.1 1.2M14.2 13.2l2.1 1.2M16.3 9.6l-2.1 1.2M9.8 13.2l-2.1 1.2" />
        </svg>
        <span>OX ALPHA</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="telemetryBtn" title="Telemetry — search missions (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg>
        </button>
        <button class="icon-btn" id="alertsBtn" title="Alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Cycle accent theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.09a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h.09a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.09a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
        <div class="theme-dots" id="themeDots"></div>
        <div class="operator-chip"><span id="rankLabel">OPERATOR · CADET</span><span class="status-led green"></span></div>
      </div>
    </div>
    <h1 class="mega-title" id="megaTitle">OX ALPHA</h1>
    <p class="console-subtitle" id="consoleSubtitle">Harness Test Console</p>

    <div class="overall-block">
      <div class="progress-meta">
        <span>OVERALL PROGRESS</span>
        <span id="overallStats"></span>
      </div>
      <div class="overall-bar">
        <div class="overall-fill" id="overallFill"></div>
        <span class="progress-percent" id="percentLabel">0%</span>
      </div>
    </div>

    <div class="filter-bar" id="filterBar">
      <div class="filter-group" data-group="difficulty" id="diffGroup"></div>
      <span class="filter-sep"></span>
      <div class="filter-group" data-group="status" id="statusGroup"></div>
      <span class="filter-sep"></span>
      <button class="filter-chip toggle-wide" id="hideDoneChip">HIDE COMPLETED</button>
      <button class="filter-chip ghost" id="clearFilters">RESET</button>
    </div>
  </header>

  <section id="benchFeed" class="bench-feed" hidden aria-label="Live benchmark feed">
    <div class="bf-head" id="bfHead">
      <span class="bf-led"></span>
      <span class="bf-title">LIVE BENCHMARK FEED</span>
      <span class="bf-summary" id="bfSummary"></span>
      <button class="bf-toggle" id="bfToggle" type="button">HIDE</button>
    </div>
    <ul class="bf-rows open" id="bfRows"></ul>
  </section>

  <main id="app" class="container"></main>

  <footer class="console-footer">
    <div class="radar" aria-hidden="true" id="radar"></div>
    <div class="footer-stats">
      <div class="stat-cell"><label>System Status</label><strong class="ok">NOMINAL<span class="status-led green"></span></strong></div>
      <div class="stat-cell"><label>Mission Time</label><strong id="missionClock">00:00:00</strong><span class="sub">Elapsed</span></div>
      <div class="stat-cell"><label>Server Region</label><strong>US-EAST-1</strong><span class="sub">AWS</span></div>
      <div class="stat-cell"><label>Connection</label><strong class="ok">SECURE<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></strong></div>
    </div>
    <div class="version-line">⟋ OX ALPHA v2.0 · DEEP SPACE EDITION</div>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="warpFlash" class="warp-flash" aria-hidden="true"></div>

  <div id="cmdkOverlay" class="cmdk-overlay" hidden>
    <div class="cmdk-panel" role="dialog" aria-label="Mission search">
      <div class="cmdk-head">
        <span class="cmdk-caret">&gt;</span>
        <input id="cmdkInput" type="text" placeholder="Search missions — title, difficulty, harness…" autocomplete="off" spellcheck="false" />
        <kbd>ESC</kbd>
      </div>
      <ul class="cmdk-results" id="cmdkResults"></ul>
      <div class="cmdk-foot"><span>↑↓ NAVIGATE</span><span>↵ JUMP TO MISSION</span><span>⧉ COPY PROMPT</span></div>
    </div>
  </div>

  <script src="prompts-data.js"></script>
  <script src="live-runs.js"></script>
  <script src="app.js"></script>
</body>
</html>
